# Cabeceras de seguridad de BGoat.
#
# Viven en un archivo aparte y no en el server porque Nginx NO acumula
# add_header: en cuanto un location declara uno propio, pierde todos los del
# nivel de arriba. Con un include en cada location no hay forma de olvidarlas.
#
# Aqui NO va HSTS: este despliegue se sirve por HTTP en el puerto 8080 (el 443
# es de Bitemo). Anunciar HSTS sin certificado dejaria el sitio inaccesible.

# El navegador respeta el Content-Type declarado y no adivina: corta el
# truco de subir un .png que en realidad es JavaScript.
add_header X-Content-Type-Options "nosniff" always;

# Nadie mete el panel dentro de un iframe ajeno (clickjacking sobre los
# botones de captura).
add_header X-Frame-Options "DENY" always;

# Al salir del sitio no se filtra la ruta interna que se estaba viendo.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# El panel no usa camara, microfono ni ubicacion.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
