# ---------------------------------------------------------------------------
# BGoat: Nginx sirve el panel compilado y hace de reverse proxy hacia la API.
#
# Escucha en el 80 DENTRO del contenedor. En el anfitrion docker-compose lo
# publica en el 8080: el 80 y el 443 del VPS son de Bitemo y este proyecto no
# los toca. Por eso aqui no hay bloque de HTTPS ni redirect.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # No anunciar la version exacta de Nginx: le ahorra a un atacante el paso
    # de averiguar contra que CVE puede tirar.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/cabeceras-seguridad.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cortafuegos contra Slowloris: con el valor por defecto de 60 s, unas pocas
    # conexiones lentas ocupan al unico worker indefinidamente. El VPS tiene un
    # solo vCPU, asi que aqui duele mas.
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Los formularios son JSON, salvo la ficha tecnica del lote: multer
    # acepta hasta 8 MB y nginx tiene que dejarla pasar, con margen para la
    # sobrecarga del multipart. Si esto queda corto, la subida se corta con
    # un 413 antes de llegar al backend.
    client_max_body_size 10m;

    # Archivos ocultos y documentacion interna: no son parte del producto.
    location ~ /\. { deny all; }
    location ~* \.(md|map)$ { deny all; }

    # --- La API ---
    # El backend ya monta todas sus rutas bajo /api, asi que el prefijo se pasa
    # tal cual: proxy_pass SIN barra final no reescribe la ruta.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Las fichas tecnicas de los lotes ---
    # Archivos que la digitadora sube desde la pantalla del lote. Los sirve
    # el backend desde su volumen, no este contenedor: por eso tambien van
    # por proxy. `client_max_body_size` tiene que dejar pasar los 8 MB que
    # acepta multer, o nginx corta la subida antes de que llegue.
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Los assets del build ---
    # Vite les pone un hash en el nombre, asi que su contenido nunca cambia:
    # cachearlos un ano es seguro y le quita trabajo al unico vCPU.
    # Va ANTES de `location /` por claridad; Nginx igual prefiere el prefijo
    # mas largo. Repite el include porque su add_header propio borraria las
    # cabeceras de seguridad del server.
    location /assets/ {
        include /etc/nginx/cabeceras-seguridad.conf;
        # Un solo Cache-Control: la directiva `expires` emite el suyo y se
        # sumaba a este add_header, dejando la cabecera duplicada.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- El panel ---
    # Cualquier ruta que no sea un archivo real cae en index.html.
    #
    # Hoy el panel navega por estado y no por URL (ver src/routes.js: las
    # pantallas se registran por nombre, no por path), asi que en la practica
    # todo vive en "/". Esto se queda igual por dos razones: una URL escrita a
    # mano abre el panel en vez de dar un 404, y el dia que se pase a rutas
    # reales recargar dentro de una no se rompe.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
