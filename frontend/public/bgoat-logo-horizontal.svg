<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 470 118" role="img" aria-label="BGoat, gestión de producción">
  <!-- Logo oficial de BGoat reconstruido en vector. Version horizontal para
       la barra de la portada: el monograma GB y, a su derecha, el nombre. -->
  <defs>
    <linearGradient id="bgoat-h-oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6B73C"/>
      <stop offset="1" stop-color="#D98C14"/>
    </linearGradient>
    <linearGradient id="bgoat-h-cafe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A5533"/>
      <stop offset="1" stop-color="#4E3420"/>
    </linearGradient>
    <filter id="bgoat-h-sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-3" dy="2" stdDeviation="2" flood-color="#3A2410" flood-opacity="0.35"/>
    </filter>
  </defs>
  <text x="2" y="128" font-family="Didot, 'Bodoni MT', Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="url(#bgoat-h-oro)">G</text>
  <text x="84" y="128" font-family="Didot, 'Bodoni MT', Georgia, 'Times New Roman', serif" font-size="128" font-weight="700" fill="url(#bgoat-h-cafe)" filter="url(#bgoat-h-sombra)">B</text>
  <text x="196" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" textLength="266" lengthAdjust="spacing" fill="#3B2A1A">BGOAT</text>
  <text x="198" y="124" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" textLength="264" lengthAdjust="spacingAndGlyphs" fill="#C98A1E">GESTIÓN DE PRODUCCIÓN</text>
</svg>
